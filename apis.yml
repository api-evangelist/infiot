name: Infiot
description: >-
  Infiot was a secure access service edge (SASE) and intelligent edge networking startup that combined
  SD-WAN, zero trust network access (ZTNA), security service edge, and cloud-delivered edge intelligence
  into a single-vendor, AI-driven service for connecting branch, remote, and IoT sites. Backed by
  Lightspeed Venture Partners, the company was acquired by Netskope in August 2022 and its technology was
  folded into Netskope's Borderless SD-WAN and Converged Access product line. Infiot no longer operates an
  independent brand, developer portal, API reference, or public API host; the former infiot.com domain now
  301-redirects to Netskope's Converged Access product page, so there is no standalone API surface to
  enrich. This profile is retained in the API Evangelist network as a Lightspeed portfolio lead with its
  acquisition status recorded.
